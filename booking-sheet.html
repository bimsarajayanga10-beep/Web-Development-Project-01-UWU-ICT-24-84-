<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking sheet</title>
    <link rel="stylesheet" href="booking-sheet.css">
   
</head>

<body>
    <header>
        <h1>STD Lanka Express</h1>
        <p>Fast & Reliable Bus Passenger Service</p>
    </header>
     <nav class="main-navbar">
    <div class="nav-container">
        <ul class="nav-links">
            <li><a href="index.html" class="btn-booking">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="online-tickets.html">Online Tickets</a></li>
            
        </ul>
    </div>
</nav>
 <div class="booking-container">
  <h2>Select Your Seats</h2>
  
   
    <div class="features-container">
  

  <ul class="legend">
    <li>
      <div class="seat available"></div>
      <small>Available</small>
    </li>
    <li>
      <div class="seat selected"></div>
      <small>Selected</small>
    </li>
    <li>
      <div class="seat occupied"></div>
      <small>Occupied</small>
    </li>
  </ul>


  <div class="bus-container">
    <div class="front-indicator">Front / Driver</div>
    
   
    <div id="seat-grid" class="seat-grid"></div>
  </div>


  <div class="booking-summary">
    <p>Selected Seats: <span id="selected-seats-list">None</span></p>
    <p>Total Price: <strong>LKR <span id="total-price">0</span></strong></p>
    <button id="book-now-btn" class="book-btn" disabled>Confirm Booking</button>
  </div>
</div>

   
    
  
    
    
</body>
</html>
